<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Cut Fantasy — Open Pack</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap');
:root {
  --font-display: "Bebas Neue", "Arial Black", sans-serif;
  --font-body: "DM Sans", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Courier New", monospace;
  --gold: #F5C518; --gold2: #FFE066; --gold-glow: rgba(245,197,24,0.3);
  --red: #E8433B; --green: #27C96A; --blue: #3B8BF5;
  --bg: #060810; --surface: #0F1218; --surface2: #151B25;
  --border: #1E2535; --border2: #283044;
  --text: #E8ECF4; --muted: #5A6A82; --muted2: #3A4558;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-body); min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; padding: 40px 20px;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(180,120,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 20% 80%, rgba(80,200,255,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(255,80,200,0.06) 0%, transparent 50%);
}

/* ═══ FLOATING PARTICLES ═══ */
.particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle {
  position: absolute; border-radius: 50%;
  animation: floatUp linear infinite;
  opacity: 0;
}
@keyframes floatUp {
  0%   { transform: translateY(100vh) scale(0); opacity: 0; }
  10%  { opacity: 0.6; }
  90%  { opacity: 0.3; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* ═══ HEADER ═══ */
.pack-header { text-align: center; margin-bottom: 36px; position: relative; z-index: 1; }
.pack-header-title {
  font-family: var(--font-display); font-size: 40px; letter-spacing: 5px;
  background: linear-gradient(135deg, #fff 0%, #a0e0ff 30%, #e0a0ff 60%, #ffd166 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; filter: drop-shadow(0 0 20px rgba(180,140,255,0.5));
}
.pack-header-sub {
  font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  letter-spacing: 3px; margin-top: 6px;
}

/* ═══ PACK WRAPPER ═══ */
.pack-stage { display: flex; flex-direction: column; align-items: center; gap: 28px; position: relative; z-index: 1; }

/* THE CARD PACK SHAPE */
.pack-object {
  width: 240px; height: 340px;
  position: relative; cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.3s ease;
  filter: drop-shadow(0 20px 60px rgba(180,120,255,0.5));
}
.pack-object:hover { transform: translateY(-10px) rotateY(-5deg) rotateX(3deg); }
.pack-object.opening { animation: rip 0.8s ease forwards; cursor: default; pointer-events: none; }

@keyframes rip {
  0%   { transform: scale(1) rotate(0deg); filter: drop-shadow(0 20px 60px rgba(255,200,80,0.8)); }
  20%  { transform: scale(1.08) rotate(1deg) translateY(-10px); }
  40%  { transform: scale(1.12) rotate(-2deg) translateY(-20px); }
  60%  { transform: scale(1.05) rotate(3deg) translateY(-10px); filter: drop-shadow(0 0 80px rgba(255,255,255,1)); }
  80%  { transform: scale(0.8) rotate(-5deg) translateY(10px); opacity: 0.5; }
  100% { transform: scale(0) rotate(10deg) translateY(30px); opacity: 0; }
}

/* PACK BODY — card pack shape */
.pack-body {
  width: 100%; height: 100%;
  border-radius: 12px 12px 6px 6px;
  position: relative; overflow: hidden;
}

/* Crystal/diamond gradient background */
.pack-bg {
  position: absolute; inset: 0;
  background: linear-gradient(
    160deg,
    #0a0a1a 0%,
    #1a0a2e 15%,
    #0a1a2e 30%,
    #1a0a1a 45%,
    #0a0a2e 60%,
    #1a1a0a 75%,
    #0a1a1a 90%,
    #0a0a1a 100%
  );
}

/* Rainbow shimmer overlay — the key effect */
.pack-shimmer {
  position: absolute; inset: 0;
  background: linear-gradient(
    105deg,
    transparent 0%,
    transparent 20%,
    rgba(255,80,80,0.15) 25%,
    rgba(255,180,0,0.2) 30%,
    rgba(80,255,80,0.15) 35%,
    rgba(0,200,255,0.2) 40%,
    rgba(120,80,255,0.2) 45%,
    rgba(255,80,200,0.15) 50%,
    transparent 55%,
    transparent 100%
  );
  animation: shimmerMove 3s ease-in-out infinite;
}
@keyframes shimmerMove {
  0%   { background-position: -200% 0; transform: skewX(-5deg); opacity: 0.6; }
  50%  { opacity: 1; }
  100% { background-position: 200% 0; transform: skewX(5deg); opacity: 0.6; }
}

/* Second shimmer layer for depth */
.pack-shimmer2 {
  position: absolute; inset: 0;
  background: linear-gradient(
    45deg,
    transparent 0%,
    rgba(255,255,255,0.03) 30%,
    rgba(255,255,255,0.12) 50%,
    rgba(255,255,255,0.03) 70%,
    transparent 100%
  );
  animation: shimmerMove2 2s ease-in-out infinite reverse;
}
@keyframes shimmerMove2 {
  0%,100% { opacity: 0.4; transform: translateX(-10px); }
  50%     { opacity: 1;   transform: translateX(10px); }
}

/* Holographic grid lines */
.pack-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* Pack border — crystal edge */
.pack-border {
  position: absolute; inset: 0; border-radius: 12px 12px 6px 6px;
  border: 1.5px solid transparent;
  background: linear-gradient(var(--bg), var(--bg)) padding-box,
    linear-gradient(135deg, #ff5080, #ffaa00, #80ff80, #00ccff, #8040ff, #ff40cc, #ff5080) border-box;
  animation: borderRotate 4s linear infinite;
}
@keyframes borderRotate {
  0%   { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

/* Tear strip at top */
.pack-tear {
  position: absolute; top: 0; left: 0; right: 0; height: 52px;
  border-radius: 12px 12px 0 0;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.08) 0%,
    rgba(200,160,255,0.12) 50%,
    rgba(255,255,255,0.08) 100%
  );
  border-bottom: 1px dashed rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
}
.tear-dots {
  display: flex; gap: 4px; align-items: center;
}
.tear-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
}
.tear-label {
  font-family: var(--font-mono); font-size: 9px;
  color: rgba(255,255,255,0.3); letter-spacing: 2px;
}

/* Main content area */
.pack-content {
  position: absolute; top: 52px; bottom: 0; left: 0; right: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  z-index: 2;
}

/* Diamond logo */
.pack-diamond-logo {
  width: 72px; height: 72px;
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  background: linear-gradient(135deg,
    rgba(255,255,255,0.9) 0%,
    rgba(180,220,255,0.8) 25%,
    rgba(220,180,255,0.8) 50%,
    rgba(255,220,180,0.8) 75%,
    rgba(255,255,255,0.9) 100%
  );
  animation: diamondSpin 6s ease-in-out infinite, diamondGlow 3s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(180,140,255,0.8));
}
@keyframes diamondSpin {
  0%,100% { transform: rotate(0deg) scale(1); }
  25%     { transform: rotate(5deg) scale(1.05); }
  75%     { transform: rotate(-5deg) scale(0.95); }
}
@keyframes diamondGlow {
  0%,100% { filter: drop-shadow(0 0 20px rgba(180,140,255,0.8)) hue-rotate(0deg); }
  50%     { filter: drop-shadow(0 0 40px rgba(255,180,80,0.9)) hue-rotate(180deg); }
}

.pack-title-text {
  font-family: var(--font-display); font-size: 26px; letter-spacing: 4px;
  background: linear-gradient(135deg, #ffffff, #c0e0ff, #e0c0ff, #ffe0a0, #ffffff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-align: center;
  animation: textShimmer 3s ease-in-out infinite;
}
@keyframes textShimmer {
  0%,100% { filter: brightness(1); }
  50%     { filter: brightness(1.3); }
}

.pack-sport-badge {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px;
  padding: 4px 14px; border-radius: 99px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.7);
}

.pack-player-count {
  font-family: var(--font-mono); font-size: 10px;
  color: rgba(255,255,255,0.3); letter-spacing: 2px; margin-top: 4px;
}

/* Bottom foil strip */
.pack-foil {
  position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
  border-radius: 0 0 6px 6px;
  background: linear-gradient(
    90deg,
    rgba(255,80,80,0.2),
    rgba(255,180,0,0.2),
    rgba(80,255,80,0.2),
    rgba(0,200,255,0.2),
    rgba(120,80,255,0.2),
    rgba(255,80,200,0.2)
  );
  animation: foilShift 2s linear infinite;
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
}
@keyframes foilShift {
  0%   { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}
.foil-text {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 4px;
  color: rgba(255,255,255,0.4);
}

/* ═══ HINT + BUTTON ═══ */
.tap-hint {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--muted); letter-spacing: 3px;
  animation: pulse 2s ease-in-out infinite;
  position: relative; z-index: 1;
}
@keyframes pulse { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

.open-btn {
  position: relative; z-index: 1;
  font-family: var(--font-display); font-size: 22px; letter-spacing: 4px;
  padding: 15px 60px; border-radius: 10px; border: none;
  cursor: pointer; transition: all 0.2s; overflow: hidden;
  background: linear-gradient(135deg, #1a0a2e, #2e1a4e);
  color: white;
  border: 1px solid transparent;
  background-clip: padding-box;
}
.open-btn::before {
  content: '';
  position: absolute; inset: -1px;
  border-radius: 11px;
  background: linear-gradient(135deg, #ff5080, #ffaa00, #80ff80, #00ccff, #8040ff, #ff40cc);
  z-index: -1;
  animation: btnBorder 3s linear infinite;
}
@keyframes btnBorder { 0%{filter:hue-rotate(0deg);} 100%{filter:hue-rotate(360deg);} }
.open-btn::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
  border-radius: 10px;
}
.open-btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 8px 40px rgba(180,100,255,0.5); }
.open-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

/* ═══ BURST EFFECT ON OPEN ═══ */
.burst {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 0; height: 0; border-radius: 50%; pointer-events: none; z-index: 100;
  animation: burstOut 0.8s ease-out forwards;
}
@keyframes burstOut {
  0%   { width: 0; height: 0; opacity: 1; background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(180,100,255,0.4), transparent 70%); }
  100% { width: 120vw; height: 120vw; opacity: 0; background: radial-gradient(circle, rgba(255,255,255,0.1), rgba(180,100,255,0.05), transparent 70%); }
}

/* ═══ REVEAL STAGE ═══ */
.reveal-stage { display: none; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 1100px; position: relative; z-index: 1; }
.reveal-stage.active { display: flex; animation: fadeIn 0.6s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

.reveal-title {
  font-family: var(--font-display); font-size: 36px; letter-spacing: 5px; text-align: center;
  background: linear-gradient(135deg, #fff 0%, #c0e0ff 30%, #e0c0ff 60%, #ffd166 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.reveal-summary {
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 12px 20px;
  backdrop-filter: blur(10px);
}
.summary-pill { font-family: var(--font-mono); font-size: 11px; padding: 4px 14px; border-radius: 99px; letter-spacing: 1px; }
.summary-pill.legendary { background: rgba(255,180,0,0.15); color: #FFD166; border: 1px solid rgba(255,180,0,0.4); }
.summary-pill.platinum  { background: rgba(155,80,255,0.15); color: #c4b5fd; border: 1px solid rgba(155,80,255,0.4); }
.summary-pill.gold      { background: rgba(240,180,0,0.15);  color: #ffe066; border: 1px solid rgba(240,180,0,0.4); }
.summary-pill.silver    { background: rgba(100,160,220,0.15);color: #c0d8f0; border: 1px solid rgba(100,160,220,0.4); }
.summary-pill.bronze    { background: rgba(210,100,50,0.15); color: #f0a070; border: 1px solid rgba(210,100,50,0.4); }

.cards-reveal { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ── Persistent card stack — used for both the one-at-a-time reveal AND
   the after-the-fact browse/review, so cards never get rebuilt, just
   repositioned. "Ahead" = still face-down, waiting its turn. "Discard" =
   already revealed, sent to the back of the pile — like flipping the top
   card of a real deck onto the bottom. ── */
.deck-progress { font-family: var(--font-mono); font-size: 12px; letter-spacing: 2px; color: var(--muted); text-align: center; margin-bottom: 14px; }
.deck-stack { position: relative; width: 200px; height: 290px; margin: 0 auto; }
.deck-stack .card-scene {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 1 !important;
  transition: transform 0.35s ease, opacity 0.35s ease;
}
.deck-current { transform: translate(0,0) rotate(0deg) scale(1) !important; }
.deck-ahead-1 { transform: translateY(6px) rotate(2deg) scale(0.97) !important; }
.deck-ahead-2 { transform: translateY(10px) rotate(-3deg) scale(0.94) !important; }
.deck-discard-1 { transform: translateY(4px) rotate(-4deg) scale(0.96) !important; opacity: 0.9; }
.deck-discard-2 { transform: translateY(7px) rotate(5deg) scale(0.93) !important; opacity: 0.75; }
.deck-discard-old { transform: translateY(9px) rotate(-2deg) scale(0.9) !important; opacity: 0.6; }
.deck-hint { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 1px; min-height: 14px; text-align: center; margin-top: 14px; }
.deck-nav { display: flex; justify-content: center; gap: 40px; margin-top: 14px; }
.carousel-arrow {
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 50%;
  width: 42px; height: 42px; color: var(--gold); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.carousel-arrow:hover { border-color: var(--gold); background: rgba(245,197,24,0.1); }

/* Player cards */
/* DD-style flip card */
.card-scene {
  width: 145px; height: 210px;
  perspective: 600px;
  cursor: pointer;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.3s, transform 0.3s;
}
.card-scene.dealt {
  opacity: 1;
  transform: translateY(0);
}
.card-scene.flipped .card-inner {
  transform: rotateY(180deg);
}
.card-scene:not(.flipped):hover .card-inner {
  transform: rotateY(10deg);
}
.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
}
.card-face, .card-back {
  position: absolute; inset: 0;
  border-radius: 14px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
/* Card back - face down */
.card-back {
  background: linear-gradient(135deg, #1a0a3e 0%, #0d1535 25%, #0a2040 50%, #0d1535 75%, #1a0a3e 100%);
  border: 1px solid rgba(150,100,255,0.5);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(120,80,255,0.3), inset 0 0 30px rgba(80,120,255,0.1);
}
.card-back::before {
  content: '';
  position: absolute; inset: 0;
  background: 
    repeating-conic-gradient(rgba(150,100,255,0.08) 0deg 10deg, transparent 10deg 20deg),
    linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%);
  animation: shimmer 3s ease-in-out infinite;
}
@keyframes shimmer {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
.card-back::after {
  content: '💎';
  font-size: 44px;
  filter: drop-shadow(0 0 16px rgba(150,100,255,0.9)) drop-shadow(0 0 30px rgba(100,150,255,0.5));
  position: relative; z-index: 1;
  animation: float 2s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-5px); }
}
/* Card front - revealed */
.card-face {
  transform: rotateY(180deg);
  overflow: hidden;
}
.player-card {
  width: 100%; height: 100%;
  position: absolute; inset: 0;
  border-radius: 14px; overflow: hidden;
}
.player-card:hover { transform: none !important; }

.player-card.bronze   { background: linear-gradient(160deg,#5a1a00,#2e0e00); border: 1px solid rgba(210,100,50,0.65); box-shadow: 0 4px 20px rgba(210,100,50,0.2); }
.player-card.silver   { background: linear-gradient(160deg,#1a2a3e,#0d1824); border: 1px solid rgba(100,160,220,0.6);  box-shadow: 0 4px 20px rgba(80,140,210,0.2); }
.player-card.gold     { background: linear-gradient(160deg,#5a3800,#2e1c00); border: 1px solid rgba(240,180,0,0.7);    box-shadow: 0 4px 20px rgba(240,180,0,0.25); }
.player-card.platinum { background: linear-gradient(160deg,#2e0a7a,#160542); border: 1px solid rgba(155,80,255,0.7);  box-shadow: 0 4px 20px rgba(140,60,240,0.25); }
.player-card.legendary{ background: linear-gradient(160deg,#7a3500,#3d1a00); border: 1px solid rgba(255,180,0,0.85); animation: legendaryPulse 2s ease-in-out infinite; }
@keyframes legendaryPulse { 0%,100%{box-shadow:0 4px 30px rgba(255,140,0,0.4);} 50%{box-shadow:0 8px 60px rgba(255,140,0,0.8);} }

/* ── Pack skin reskins on the revealed card — same full takeover used on
   roster.html/dashboard.html: background/border/glow become the equipped
   skin's palette, while .card-tier and .card-coin stay tier-colored so
   rarity still reads at a glance even though every card shares one skin. */
.player-card.skin-inferno    { background: linear-gradient(160deg, #4a0a0a, #2b0505); border: 1px solid rgba(255,59,59,0.6); box-shadow: 0 4px 20px rgba(255,59,59,0.25); }
.player-card.skin-frostbite  { background: linear-gradient(160deg, #0a3a30, #0a2e28); border: 1px solid rgba(122,255,224,0.6); box-shadow: 0 4px 20px rgba(122,255,224,0.25); }
.player-card.skin-toxic      { background: linear-gradient(160deg, #0a1a0a, #0a2a10); border: 1px solid rgba(170,255,77,0.6); box-shadow: 0 4px 20px rgba(170,255,77,0.25); }
.player-card.skin-golden     { background: linear-gradient(160deg, #3a3208, #2a2505); border: 1px solid rgba(232,255,110,0.65); box-shadow: 0 4px 20px rgba(232,255,110,0.3); }
.player-card.skin-void       { background: linear-gradient(160deg, #2a0a1a, #0f050a); border: 1px solid rgba(255,102,196,0.6); box-shadow: 0 4px 20px rgba(255,102,196,0.3); }
.player-card.skin-camo       { background: linear-gradient(160deg, #1c2814, #2b3a1f); border: 1px solid rgba(163,193,120,0.55); box-shadow: 0 4px 20px rgba(122,143,74,0.25); }
.player-card.skin-digital    { background: linear-gradient(160deg, #1a2e2e, #1a1a1a); border: 1px solid rgba(77,255,200,0.6); box-shadow: 0 4px 20px rgba(77,255,200,0.25); }
.player-card.skin-chrome     { background: linear-gradient(160deg, #3a3a3a, #0d0d0d); border: 1px solid rgba(245,245,245,0.6); box-shadow: 0 4px 20px rgba(245,245,245,0.2); }
.player-card.skin-prestige   { background: linear-gradient(160deg, #1a0a10, #000000); border: 1px solid rgba(255,77,109,0.6); box-shadow: 0 4px 20px rgba(255,77,109,0.25); }
.player-card.skin-gridrunner { background: linear-gradient(160deg, #04141f, #000000); border: 1px solid rgba(41,224,255,0.7); box-shadow: 0 4px 20px rgba(41,224,255,0.3); }

.skin-inferno .card-name    { color: #ff3b3b; }
.skin-frostbite .card-name  { color: #7affe0; }
.skin-toxic .card-name      { color: #aaff4d; }
.skin-golden .card-name     { color: #e8ff6e; }
.skin-void .card-name       { color: #ff66c4; }
.skin-camo .card-name       { color: #a3c178; }
.skin-digital .card-name    { color: #4dffc8; }
.skin-chrome .card-name     { color: #f5f5f5; }
.skin-prestige .card-name   { color: #ff4d6d; }
.skin-gridrunner .card-name { color: #29e0ff; }

.card-rays { position:absolute;inset:0;z-index:0;background:repeating-conic-gradient(rgba(255,255,255,0.04) 0deg 10deg,transparent 10deg 20deg); }
.card-glow { position:absolute;bottom:52px;left:50%;transform:translateX(-50%);width:120px;height:50px;border-radius:50%;z-index:1;filter:blur(18px); }
.player-card.bronze .card-glow   { background:rgba(210,100,50,0.7); }
.player-card.silver .card-glow   { background:rgba(80,140,220,0.7); }
.player-card.gold .card-glow     { background:rgba(240,180,0,0.7); }
.player-card.platinum .card-glow { background:rgba(140,60,255,0.7); }
.player-card.legendary .card-glow{ background:rgba(255,140,0,0.9); }
/* Skinned cards: the glow blob behind the art matches the skin, not the tier. */
.player-card.skin-inferno .card-glow    { background: rgba(255,59,59,0.7); }
.player-card.skin-frostbite .card-glow  { background: rgba(122,255,224,0.7); }
.player-card.skin-toxic .card-glow      { background: rgba(170,255,77,0.7); }
.player-card.skin-golden .card-glow     { background: rgba(232,255,110,0.7); }
.player-card.skin-void .card-glow       { background: rgba(255,102,196,0.7); }
.player-card.skin-camo .card-glow       { background: rgba(163,193,120,0.6); }
.player-card.skin-digital .card-glow    { background: rgba(77,255,200,0.7); }
.player-card.skin-chrome .card-glow     { background: rgba(245,245,245,0.6); }
.player-card.skin-prestige .card-glow   { background: rgba(255,77,109,0.7); }
.player-card.skin-gridrunner .card-glow { background: rgba(41,224,255,0.75); }
/* Skinned cards: hide the plain-white sunburst rays so the skin's own
   background/pattern reads clean instead of fighting with it. */
.player-card[class*="skin-"] .card-rays { display: none; }
.card-shine { position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.08) 0%,transparent 50%,rgba(255,255,255,0.02) 100%);z-index:3; }
.card-tier { position:absolute;top:8px;left:8px;font-family:var(--font-display);font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:4px;z-index:10; }
.player-card.bronze .card-tier   { background:rgba(0,0,0,0.4);color:#f0a070;border:1px solid rgba(210,100,50,0.5); }
.player-card.silver .card-tier   { background:rgba(0,0,0,0.4);color:#c0d8f0;border:1px solid rgba(100,160,220,0.5); }
.player-card.gold .card-tier     { background:rgba(0,0,0,0.4);color:#ffe066;border:1px solid rgba(240,180,0,0.5); }
.player-card.platinum .card-tier { background:rgba(0,0,0,0.4);color:#c4b5fd;border:1px solid rgba(155,80,255,0.5); }
.player-card.legendary .card-tier{ background:rgba(0,0,0,0.4);color:#FFD166;border:1px solid rgba(255,180,0,0.7); }
.card-coin { position:absolute;top:8px;right:8px;font-family:var(--font-mono);font-size:10px;font-weight:700;z-index:10; }
.player-card.bronze .card-coin { color:#f0a070; }
.player-card.silver .card-coin { color:#c0d8f0; }
.player-card.gold .card-coin   { color:#ffe066; }
.player-card.platinum .card-coin { color:#c4b5fd; }
.player-card.legendary .card-coin{ color:#FFD166; }
.card-art-batter { position:absolute;top:35px;left:0;right:0;bottom:52px;display:flex;align-items:center;justify-content:center;overflow:hidden; }
.card-art-batter .card-art-fill { width:95%;height:95%; }
.card-art-pitcher { position:absolute;top:28px;left:0;right:0;height:118px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden; }
.card-art-pitcher .card-art-fill { height:110px;width:110px;position:absolute;bottom:0;left:50%;transform:translateX(-50%); }

/* ── Silhouette fill: the player art stays the mask (shape only); the
   fill is a flat, skin-colored solid so it never blends with its own
   glow/border, matching roster.html/dashboard.html. ── */
.card-art-fill {
  -webkit-mask-size: contain; mask-size: contain;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center; mask-position: center;
  filter: drop-shadow(0 0 16px rgba(255,255,255,0.5));
  z-index: 2;
}
.card-art-fill.fill-classic    { background: #fff; }
.card-art-fill.fill-inferno    { background: #fff; }
.card-art-fill.fill-frostbite  { background: #fff; }
.card-art-fill.fill-toxic      { background: #fff; }
.card-art-fill.fill-golden     { background: #fff; }
.card-art-fill.fill-void       { background: #fff; }
.card-art-fill.fill-camo       { background: #e3c88f; }
.card-art-fill.fill-digital    { background: #fff; }
.card-art-fill.fill-chrome     { background: linear-gradient(100deg, #fff 25%, #fff 38%, #c9c9c9 44%, #fff 50%, #fff 70%); }
.card-art-fill.fill-prestige   { background: #e8e8ee; }
.card-art-fill.fill-gridrunner { background: #fff; }
.card-divider { position:absolute;top:146px;left:10px;right:10px;height:1px;z-index:4; }
.player-card.bronze .card-divider   { background:rgba(210,100,50,0.4); }
.player-card.silver .card-divider   { background:rgba(100,160,220,0.35); }
.player-card.gold .card-divider     { background:rgba(240,180,0,0.4); }
.player-card.platinum .card-divider { background:rgba(155,80,255,0.4); }
.player-card.legendary .card-divider{ background:rgba(255,180,0,0.6); }
.card-info { position:absolute;bottom:0;left:0;right:0;padding:8px 10px 10px;background:rgba(0,0,0,0.6);z-index:5; }
.card-name { font-family:var(--font-display);font-size:14px;letter-spacing:1px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.player-card.bronze .card-name   { color:#f0a070; }
.player-card.silver .card-name   { color:#c0d8f0; }
.player-card.gold .card-name     { color:#ffe066; }
.player-card.platinum .card-name { color:#c4b5fd; }
.player-card.legendary .card-name{ color:#FFD166; text-shadow:0 0 10px rgba(255,180,0,0.6); }
.card-pos-team { font-family:var(--font-mono);font-size:9px;color:#5A6A82;margin-top:3px;display:flex;justify-content:space-between; }
.card-new { font-family:var(--font-mono);font-size:9px;font-weight:700;color:#27C96A;margin-top:3px; }

.dst-abbrev {
  font-family: var(--font-display);
  font-size: 32px;
  letter-spacing: 3px;
  color: white;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  position: absolute;
  bottom: 58px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  z-index: 2;
}

/* Actions */
.reveal-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.action-btn.secondary { background: var(--surface2); border: 1px solid var(--gold); color: var(--gold); font-family: var(--font-display); font-size: 14px; letter-spacing: 2px; padding: 12px 28px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.action-btn.secondary:hover { background: rgba(245,197,24,0.15); }
.action-btn:not(.primary):not(.secondary) { background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); font-family: var(--font-display); font-size: 14px; letter-spacing: 2px; padding: 12px 28px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.action-btn:not(.primary):not(.secondary):hover { border-color: var(--text); color: var(--text); }
.action-btn {
  font-family: var(--font-display); font-size: 16px; letter-spacing: 3px;
  padding: 13px 36px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.15s;
  position: relative; overflow: hidden;
}
.action-btn.primary {
  background: linear-gradient(135deg, #1a0a2e, #2e1a4e); color: white;
  border: 1px solid transparent;
}
.action-btn.primary::before {
  content: ''; position: absolute; inset: -1px; border-radius: 11px;
  background: linear-gradient(135deg, #ff5080, #ffaa00, #80ff80, #00ccff, #8040ff, #ff40cc);
  z-index: -1; animation: btnBorder 3s linear infinite;
}
@keyframes btnBorder { 0%{filter:hue-rotate(0deg);} 100%{filter:hue-rotate(360deg);} }
.action-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(180,100,255,0.4); }
.action-btn.primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.action-btn.ghost { background: transparent; border: 1px solid var(--border2); color: var(--muted); }
.action-btn.ghost:hover { border-color: rgba(180,100,255,0.5); color: rgba(180,100,255,0.8); }

.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Legendary flash */
.legendary-flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 999;
  background: radial-gradient(ellipse at center, rgba(255,200,0,0.3), rgba(255,100,0,0.1), transparent 70%);
  animation: flashLeg 1.5s ease forwards;
}
@keyframes flashLeg { 0%{opacity:1;} 100%{opacity:0;} }

@media (max-width: 480px) {
  body { padding: 24px 14px; }
  .pack-header-title { font-size: 26px; }
  .pack-object { width: 190px; height: 270px; }
  .card-scene { width: 120px; height: 175px; }
  .card-art-batter { top: 29px; bottom: 43px; }
  .card-art-pitcher { top: 23px; height: 98px; }
  .card-art-pitcher .card-art-fill { height: 92px; width: 92px; }
  .card-divider { top: 122px; left: 8px; right: 8px; }
  .action-btn, .action-btn.secondary, .action-btn:not(.primary):not(.secondary) { padding: 11px 20px; font-size: 12px; }
  .deck-stack { width: 120px; height: 175px; }
  .deck-progress { font-size: 10px; }
  .deck-hint { font-size: 9px; }
}

/* ═══ PACK SKINS ═══════════════════════════════════════════════════════
   Each skin recolors the same handful of elements (ambient glow, the
   pack's own gradient, its rainbow border/shimmer, the title text, and
   the diamond logo glow) instead of duplicating the whole pack markup.
   "classic" is the default look above and needs no overrides here. */

body[data-skin="inferno"] { background-image: radial-gradient(ellipse at 50% 0%, rgba(255,59,59,0.1) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(255,59,59,0.07) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(255,167,167,0.06) 0%, transparent 50%); }
body[data-skin="inferno"] .pack-bg { background: linear-gradient(160deg, #4a0a0a 0%, #2b0505 25%, #4a0a0a 50%, #1e0404 75%, #4a0a0a 100%); }
body[data-skin="inferno"] .pack-shimmer { background: linear-gradient(105deg, transparent 0%, transparent 20%, rgba(255,59,59,0.25) 28%, rgba(255,167,167,0.25) 38%, rgba(255,59,59,0.2) 48%, transparent 55%, transparent 100%); }
body[data-skin="inferno"] .pack-border { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(135deg, #731b1b, #ff3b3b, #ffa7a7, #731b1b) border-box; }
body[data-skin="inferno"] .pack-title-text { background: linear-gradient(135deg, #fff 0%, #ffa7a7 30%, #ff3b3b 60%, #ffd8d8 100%); -webkit-background-clip: text; background-clip: text; }
body[data-skin="inferno"] .pack-diamond-logo { filter: drop-shadow(0 0 20px rgba(255,59,59,0.85)); }
body[data-skin="inferno"] .pack-object { filter: drop-shadow(0 20px 60px rgba(255,59,59,0.55)); }
body[data-skin="inferno"] .pack-object:hover { filter: drop-shadow(0 20px 60px rgba(255,59,59,0.75)); }

body[data-skin="frostbite"] { background-image: radial-gradient(ellipse at 50% 0%, rgba(122,255,224,0.1) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(122,255,224,0.07) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(195,255,241,0.06) 0%, transparent 50%); }
body[data-skin="frostbite"] .pack-bg { background: linear-gradient(160deg, #0a3a30 0%, #0a2e28 25%, #0a3a30 50%, #07201c 75%, #0a3a30 100%); }
body[data-skin="frostbite"] .pack-shimmer { background: linear-gradient(105deg, transparent 0%, transparent 20%, rgba(122,255,224,0.25) 28%, rgba(195,255,241,0.25) 38%, rgba(122,255,224,0.2) 48%, transparent 55%, transparent 100%); }
body[data-skin="frostbite"] .pack-border { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(135deg, #377365, #7affe0, #c3fff1, #377365) border-box; }
body[data-skin="frostbite"] .pack-title-text { background: linear-gradient(135deg, #fff 0%, #c3fff1 30%, #7affe0 60%, #e4fff9 100%); -webkit-background-clip: text; background-clip: text; }
body[data-skin="frostbite"] .pack-diamond-logo { filter: drop-shadow(0 0 20px rgba(122,255,224,0.85)); }
body[data-skin="frostbite"] .pack-object { filter: drop-shadow(0 20px 60px rgba(122,255,224,0.55)); }
body[data-skin="frostbite"] .pack-object:hover { filter: drop-shadow(0 20px 60px rgba(122,255,224,0.75)); }

body[data-skin="toxic"] { background-image: radial-gradient(ellipse at 50% 0%, rgba(150,255,60,0.10) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(100,255,80,0.07) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(200,255,120,0.06) 0%, transparent 50%); }
body[data-skin="toxic"] .pack-bg { background: linear-gradient(160deg, #0a1a0a 0%, #0a2a10 25%, #0a1a0a 50%, #051505 75%, #0a1a0a 100%); }
body[data-skin="toxic"] .pack-shimmer { background: linear-gradient(105deg, transparent 0%, transparent 20%, rgba(150,255,60,0.25) 28%, rgba(200,255,120,0.25) 38%, rgba(120,255,80,0.2) 48%, transparent 55%, transparent 100%); }
body[data-skin="toxic"] .pack-border { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(135deg, #6fff20, #aaff4d, #d4ff90, #6fff20) border-box; }
body[data-skin="toxic"] .pack-title-text { background: linear-gradient(135deg, #fff 0%, #d4ff90 30%, #aaff4d 60%, #f0ffd0 100%); -webkit-background-clip: text; background-clip: text; }
body[data-skin="toxic"] .pack-diamond-logo { filter: drop-shadow(0 0 20px rgba(170,255,77,0.85)); }
body[data-skin="toxic"] .pack-object { filter: drop-shadow(0 20px 60px rgba(150,255,70,0.5)); }
body[data-skin="toxic"] .pack-object:hover { filter: drop-shadow(0 20px 60px rgba(150,255,70,0.7)); }

body[data-skin="golden"] { background-image: radial-gradient(ellipse at 50% 0%, rgba(232,255,110,0.1) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(232,255,110,0.07) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(245,255,190,0.06) 0%, transparent 50%); }
body[data-skin="golden"] .pack-bg { background: linear-gradient(160deg, #3a3208 0%, #2a2505 25%, #3a3208 50%, #1d1a04 75%, #3a3208 100%); }
body[data-skin="golden"] .pack-shimmer { background: linear-gradient(105deg, transparent 0%, transparent 20%, rgba(232,255,110,0.25) 28%, rgba(245,255,190,0.25) 38%, rgba(232,255,110,0.2) 48%, transparent 55%, transparent 100%); }
body[data-skin="golden"] .pack-border { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(135deg, #687331, #e8ff6e, #f5ffbe, #687331) border-box; }
body[data-skin="golden"] .pack-title-text { background: linear-gradient(135deg, #fff 0%, #f5ffbe 30%, #e8ff6e 60%, #faffe2 100%); -webkit-background-clip: text; background-clip: text; }
body[data-skin="golden"] .pack-diamond-logo { filter: drop-shadow(0 0 20px rgba(232,255,110,0.85)); }
body[data-skin="golden"] .pack-object { filter: drop-shadow(0 20px 60px rgba(232,255,110,0.55)); }
body[data-skin="golden"] .pack-object:hover { filter: drop-shadow(0 20px 60px rgba(232,255,110,0.75)); }

body[data-skin="void"] { background-image: radial-gradient(ellipse at 50% 0%, rgba(255,102,196,0.1) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(255,102,196,0.07) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(255,186,228,0.06) 0%, transparent 50%); }
body[data-skin="void"] .pack-bg { background: linear-gradient(160deg, #2a0a1a 0%, #0f050a 25%, #2a0a1a 50%, #0a0407 75%, #2a0a1a 100%); }
body[data-skin="void"] .pack-shimmer { background: linear-gradient(105deg, transparent 0%, transparent 20%, rgba(255,102,196,0.25) 28%, rgba(255,186,228,0.25) 38%, rgba(255,102,196,0.2) 48%, transparent 55%, transparent 100%); }
body[data-skin="void"] .pack-border { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(135deg, #732e58, #ff66c4, #ffbae4, #732e58) border-box; }
body[data-skin="void"] .pack-title-text { background: linear-gradient(135deg, #fff 0%, #ffbae4 30%, #ff66c4 60%, #ffe0f3 100%); -webkit-background-clip: text; background-clip: text; }
body[data-skin="void"] .pack-diamond-logo { filter: drop-shadow(0 0 20px rgba(255,102,196,0.85)); }
body[data-skin="void"] .pack-object { filter: drop-shadow(0 20px 60px rgba(255,102,196,0.55)); }
body[data-skin="void"] .pack-object:hover { filter: drop-shadow(0 20px 60px rgba(255,102,196,0.75)); }

/* ═══ "Gun skin" tier — tactical/camo finishes ══════════════════════ */

/* Woodland Ops: mottled camo blotches instead of a flat gradient */
body[data-skin="camo"] { background-image: radial-gradient(ellipse at 50% 0%, rgba(122,143,74,0.10) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(43,58,31,0.10) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(28,40,20,0.10) 0%, transparent 50%); }
body[data-skin="camo"] .pack-bg {
  background:
    radial-gradient(circle at 18% 28%, #4a5a2f 0 15%, transparent 16%),
    radial-gradient(circle at 62% 8%,  #1c2814 0 20%, transparent 21%),
    radial-gradient(circle at 82% 58%, #7a8f4a 0 18%, transparent 19%),
    radial-gradient(circle at 28% 78%, #14200e 0 22%, transparent 23%),
    radial-gradient(circle at 72% 88%, #4a5a2f 0 16%, transparent 17%),
    radial-gradient(circle at 45% 45%, #2b3a1f 0 24%, transparent 25%),
    linear-gradient(160deg, #2b3a1f 0%, #1c2814 50%, #2b3a1f 100%);
  background-size: 220% 220%, 180% 180%, 200% 200%, 190% 190%, 170% 170%, 210% 210%, 100% 100%;
}
body[data-skin="camo"] .pack-shimmer { background: linear-gradient(105deg, transparent 0%, transparent 25%, rgba(200,220,150,0.15) 35%, rgba(150,180,100,0.15) 45%, transparent 55%, transparent 100%); }
body[data-skin="camo"] .pack-border { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(135deg, #3d4d26, #7a8f4a, #1c2814, #3d4d26) border-box; }
body[data-skin="camo"] .pack-title-text { background: linear-gradient(135deg, #eaf0d8 0%, #b8cc8a 30%, #7a8f4a 60%, #eaf0d8 100%); -webkit-background-clip: text; background-clip: text; }
body[data-skin="camo"] .pack-diamond-logo { filter: drop-shadow(0 0 18px rgba(122,143,74,0.85)); }
body[data-skin="camo"] .pack-object { filter: drop-shadow(0 20px 60px rgba(40,55,25,0.6)); }
body[data-skin="camo"] .pack-object:hover { filter: drop-shadow(0 20px 60px rgba(40,55,25,0.8)); }

/* Digital Recon: pixel-block digital camo with a cyan HUD glow */
body[data-skin="digital"] { background-image: radial-gradient(ellipse at 50% 0%, rgba(77,255,200,0.1) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(77,255,200,0.07) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(175,255,230,0.06) 0%, transparent 50%); }
body[data-skin="digital"] .pack-bg { background: linear-gradient(160deg, #1a2e2e 0%, #1a1a1a 25%, #1a2e2e 50%, #121212 75%, #1a2e2e 100%); }
body[data-skin="digital"] .pack-shimmer { background: linear-gradient(105deg, transparent 0%, transparent 20%, rgba(77,255,200,0.25) 28%, rgba(175,255,230,0.25) 38%, rgba(77,255,200,0.2) 48%, transparent 55%, transparent 100%); }
body[data-skin="digital"] .pack-border { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(135deg, #23735a, #4dffc8, #afffe6, #23735a) border-box; }
body[data-skin="digital"] .pack-title-text { background: linear-gradient(135deg, #fff 0%, #afffe6 30%, #4dffc8 60%, #dbfff4 100%); -webkit-background-clip: text; background-clip: text; }
body[data-skin="digital"] .pack-diamond-logo { filter: drop-shadow(0 0 20px rgba(77,255,200,0.85)); }
body[data-skin="digital"] .pack-object { filter: drop-shadow(0 20px 60px rgba(77,255,200,0.55)); }
body[data-skin="digital"] .pack-object:hover { filter: drop-shadow(0 20px 60px rgba(77,255,200,0.75)); }

/* Diamond Chrome: mirror-polished cross-hatched plating */
body[data-skin="chrome"] { background-image: radial-gradient(ellipse at 50% 0%, rgba(245,245,245,0.1) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(245,245,245,0.07) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(250,250,250,0.06) 0%, transparent 50%); }
body[data-skin="chrome"] .pack-bg { background: linear-gradient(160deg, #3a3a3a 0%, #0d0d0d 25%, #3a3a3a 50%, #090909 75%, #3a3a3a 100%); }

<body>

<script type="module">
import { supabase } from './supabase.js'
import { findSkin } from './packskins.js'

const BATTER_IMG  = 'art/batter.png'
const PITCHER_IMG = 'art/pitcher.png'
const QB_IMG = 'art/qb.png'
const RB_IMG = 'art/rb.png'
const WR_IMG = 'art/wr.png'
const TE_IMG = 'art/wr.png'
const K_IMG = 'art/k.png'
const PITCHER_POS = ['SP','RP','P']
const TIER_VALS   = {legendary:200, platinum:100, gold:60, silver:25, bronze:10}
const TIER_COIN   = {legendary:'👑', platinum:'100', gold:'60', silver:'25', bronze:'10'}
const PACK_SLOTS  = [{tier:'platinum',count:1},{tier:'gold',count:3},{tier:'silver',count:6},{tier:'bronze',count:7}]

let pickedPlayers = []
let leagueId, teamId, sport, leagueWeek
let equippedSkin = 'classic'

// Generate floating particles. Colors default to the rainbow "classic"
// look, but once init() knows the team's equipped skin it calls this
// again with that skin's swatch so the particles match the pack.
function spawnParticles(swatchColors) {
  const container = document.getElementById('particles')
  if (!container) return
  container.innerHTML = ''
  const colors = swatchColors && swatchColors.length
    ? swatchColors.map(c => hexToRgba(c, 0.6))
    : ['rgba(180,100,255,0.6)','rgba(100,180,255,0.6)','rgba(255,180,80,0.6)','rgba(80,255,180,0.6)','rgba(255,80,180,0.6)']
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div')
    p.className = 'particle'
    const size = Math.random() * 4 + 2
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${Math.random()*8+6}s;
      animation-delay:${Math.random()*8}s;
    `
    container.appendChild(p)
  }
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '')
  const r = parseInt(h.substring(0, 2), 16)
  const g = parseInt(h.substring(2, 4), 16)
  const b = parseInt(h.substring(4, 6), 16)
  return `rgba(${r},${g},${b},${alpha})`
}

spawnParticles()

async function init() {
  const { data: { user } } = await supabase.auth.getUser()
  if (!user) {
    document.getElementById('packSub').textContent = 'Please sign in to open your pack.'
    document.getElementById('openBtn').disabled = true
    document.getElementById('tapHint').style.display = 'none'
    return
  }

  // NOTE: this used to read from sessionStorage, which nothing in the app
  // reliably writes to — dashboard.html, join-league.html, etc. all use
  // localStorage. That meant this page was liable to run on a stale,
  // leftover team ID cached earlier in the same browser tab (e.g. your
  // OTHER team from earlier testing), which is what caused the false
  // "you already opened this week's pack" block. Reading from localStorage
  // now, like every other page.
  leagueId = localStorage.getItem('activeLeagueId')
  teamId   = localStorage.getItem('activeTeamId')

  if (!leagueId || !teamId) {
    document.getElementById('packSub').textContent = 'No active league found. Go to the Dashboard to set up your league first.'
    document.getElementById('openBtn').disabled = true
    document.getElementById('tapHint').style.display = 'none'
    return
  }

  // Load current league week + sport so pack availability is per-week, not
  // lifetime, and the pack pulls from the correct sport's player pool.
  // Sport always comes straight from the league record — the single
  // source of truth — instead of a cached value that can go stale.
  const { data: leagueRow } = await supabase.from('leagues').select('week_number, sport').eq('id', leagueId).single()
  leagueWeek = leagueRow?.week_number || 1
  sport = leagueRow?.sport || localStorage.getItem('activeSport') || 'MLB'
  localStorage.setItem('activeSport', sport)
  localStorage.setItem('activeLeagueWeek', String(leagueWeek))

  // Check whether this team already opened its pack for the CURRENT week.
  // (Previously this checked for any existing roster row ever, which
  // permanently blocked teams once a keeper kept a player on the roster.)
  const { data: team } = await supabase.from('teams').select('pack_opened_week, equipped_skin').eq('id', teamId).single()

  // Apply the team's equipped pack skin (defaults to 'classic', which
  // matches the base look already baked into the CSS above and needs no
  // override). This recolors the pack art via body[data-skin="..."] CSS
  // rules and re-tints the floating particles to match.
  const skin = findSkin(team?.equipped_skin)
  equippedSkin = skin.id
  document.body.setAttribute('data-skin', skin.id)
  spawnParticles(skin.id === 'classic' ? null : skin.swatch)

  if (team?.pack_opened_week === leagueWeek) {
    alert('You already opened this week\'s pack!')
    window.location.href = 'dashboard.html'
    return
  }

  // Show the correct card count up front (17 minus whatever's already kept
  // and surviving on the roster — see the fuller explanation in openPack()
  // for why we check the roster directly instead of keeper_queue by week)
  const { data: myRosterPreview } = await supabase
    .from('rosters').select('player_id, is_keeper')
    .eq('team_id', teamId).eq('league_id', leagueId)
  const previewKeptIds = (myRosterPreview || []).filter(r => !r.is_keeper).map(r => r.player_id)
  let cardCount = 17
  if (previewKeptIds.length > 0) {
    const { data: previewKeptPlayers } = await supabase
      .from('players').select('tier').in('id', previewKeptIds)
    const keptEligible = (previewKeptPlayers || []).filter(p => ['bronze','silver','gold'].includes(p.tier))
    cardCount = 17 - keptEligible.length
  }

  document.getElementById('packSub').textContent    = `${sport} · WEEK ${leagueWeek} PACK · ${cardCount} PLAYERS`
  document.getElementById('packSportBadge').textContent = sport
  document.getElementById('tapHint').style.display  = 'block'
}

window.openPack = async () => {
  const packObj = document.getElementById('packObject')
  const openBtn = document.getElementById('openBtn')
  if (packObj.classList.contains('opening')) return
  packObj.classList.add('opening')
  openBtn.disabled = true
  document.getElementById('tapHint').style.display = 'none'

  // Burst effect
  const burst = document.createElement('div')
  burst.className = 'burst'
  document.body.appendChild(burst)
  setTimeout(() => burst.remove(), 1000)

  // Fetch players — pull exactly by tier+position so pack always = 500pts
  // 1 plat(100) + 3 gold(180) + 6 silver(150) + 7 bronze(70) = 500
  // Each required position is assigned a tier from the pack budget.
  // Remaining spots fill from the same tier budget with any eligible position.
  // Exclude: already rostered + auction pool + legendary reserved at league creation
  const { data: leagueRosters } = await supabase
    .from('rosters').select('player_id').eq('league_id', leagueId)
  const rosteredIds = (leagueRosters || []).map(r => r.player_id).filter(Boolean)

  const { data: auctionPool } = await supabase
    .from('auction_pool').select('player_id').eq('league_id', leagueId).eq('week_number', leagueWeek)
  const auctionIds = (auctionPool || []).map(r => r.player_id).filter(Boolean)

  const { data: legendaryReserved } = await supabase
    .from('league_legendary').select('player_id').eq('league_id', leagueId).eq('week_number', leagueWeek)
  const legendaryIds = (legendaryReserved || []).map(r => r.player_id).filter(Boolean)

  const usedIds = [...new Set([...rosteredIds, ...auctionIds, ...legendaryIds])]
  pickedPlayers = []

  // ── Account for players this team already kept this week ────────────────
  // Keepers (Bronze/Silver/Gold — Platinum & Legendary aren't keep-eligible)
  // already occupy a slot of that tier's value, so the new pack must hand
  // out one fewer card of that tier per kept player. This keeps every
  // team's total roster value equal (500 pts / 17 cards) regardless of how
  // many keeps they made.
  //
  // NOTE: we check the team's CURRENT roster rather than re-querying
  // keeper_queue by week_number. A confirmed keeper_queue row is stamped
  // with the week it was queued for — after weekly-reset advances
  // leagues.week_number, there's no fresh keeper_queue row for the new
  // week yet, so matching on the new week_number here would always find
  // nothing. Whatever survived the reset onto this team's roster (and
  // isn't the permanent legendary is_keeper card) IS the kept player —
  // that's the actual source of truth.
  const { data: myRosterRows } = await supabase
    .from('rosters').select('player_id, is_keeper')
    .eq('team_id', teamId).eq('league_id', leagueId)
  const nonLegendaryKeptIds = (myRosterRows || []).filter(r => !r.is_keeper).map(r => r.player_id)
  const keptTierCounts = {}
  if (nonLegendaryKeptIds.length > 0) {
    const { data: keptPlayerRows } = await supabase
      .from('players').select('tier').in('id', nonLegendaryKeptIds)
    for (const p of (keptPlayerRows || [])) {
      if (['bronze','silver','gold'].includes(p.tier)) {
        keptTierCounts[p.tier] = (keptTierCounts[p.tier] || 0) + 1
      }
    }
  }
  const keptCount = Object.values(keptTierCounts).reduce((s, n) => s + n, 0)
  const maxNewCards = 17 - keptCount

  document.getElementById('packSub').textContent    = `${sport} · WEEK ${leagueWeek} PACK · ${maxNewCards} PLAYERS`
  document.getElementById('packPlayerCount').textContent = `${maxNewCards} PLAYERS INSIDE`

  // Tier-tagged required positions — assigned to match PACK_SLOTS exactly:
  // platinum:1, gold:3, silver:6, bronze:7
  // MLB: 1C 1-1B 1-2B 1-3B 1SS 3OF 3SP 1RP = 12 required + 5 bench fillers
  // NFL: 1QB 2RB 3WR 1TE = 7 required + 10 bench fillers
  const MLB_REQUIRED = [
    {pos:'C',  tier:'silver'},
    {pos:'1B', tier:'silver'},
    {pos:'2B', tier:'bronze'},
    {pos:'3B', tier:'silver'},
    {pos:'SS', tier:'bronze'},
    {pos:'OF', tier:'platinum'},
    {pos:'OF', tier:'gold'},
    {pos:'OF', tier:'silver'},
    {pos:'SP', tier:'gold'},
    {pos:'SP', tier:'silver'},
    {pos:'SP', tier:'bronze'},
    {pos:'RP', tier:'bronze'},
  ]
  // Randomize which position gets the platinum card so it's not always QB
  const nflPlatinumPos = ['QB','RB','WR'][Math.floor(Math.random() * 3)]
  const nflGoldPositions = ['RB','WR','TE'].filter(p => p !== nflPlatinumPos)
  const NFL_REQUIRED = [
    {pos: nflPlatinumPos, tier:'platinum'},
    {pos:'RB', tier:'gold'},
    {pos:'RB', tier:'silver'},
    {pos:'WR', tier:'gold'},
    {pos:'WR', tier:'silver'},
    {pos:'WR', tier:'bronze'},
    {pos:'TE', tier:'silver'},
  ].sort(() => Math.random() - 0.5) // shuffle order so pack reveals feel varied
  const required = sport === 'NFL' ? NFL_REQUIRED : MLB_REQUIRED

  // Remove one required slot per kept tier — the kept player already covers
  // that tier's value, so we don't force-draw a replacement for it.
  let requiredPool = required
  for (const [tier, n] of Object.entries(keptTierCounts)) {
    let toRemove = n
    requiredPool = requiredPool.filter(r => {
      if (toRemove > 0 && r.tier === tier) { toRemove--; return false }
      return true
    })
  }

  // Track remaining tier budget after required positions are filled
  const tierBudget = { platinum:1, gold:3, silver:6, bronze:7 }
  for (const [tier, n] of Object.entries(keptTierCounts)) {
    tierBudget[tier] = Math.max(0, (tierBudget[tier] || 0) - n)
  }

  for (const {pos, tier} of requiredPool) {
    let query = supabase
      .from('players')
      .select('id, name, position, team, tier, tier_value, projected_points, sport')
      .eq('sport', sport)
      .eq('position', pos)
      .eq('tier', tier)
      .neq('is_legendary_active', true)
      .order('projected_points', { ascending: false })
      .limit(20)
    if (usedIds.length > 0) query = query.not('id', 'in', `(${usedIds.join(',')})`)
    const { data: avail } = await query
    if (!avail || avail.length === 0) continue
    const picked = avail[Math.floor(Math.random() * Math.min(avail.length, 10))]
    usedIds.push(picked.id)
    pickedPlayers.push(picked)
    tierBudget[tier] = (tierBudget[tier] || 0) - 1
  }

  // Fill remaining spots using leftover tier budget
  for (const [tier, count] of Object.entries(tierBudget)) {
    for (let i = 0; i < count; i++) {
      const spotsLeft = maxNewCards - pickedPlayers.length
      if (spotsLeft <= 0) break
      let query = supabase
        .from('players')
        .select('id, name, position, team, tier, tier_value, projected_points, sport')
        .eq('tier', tier)
        .eq('sport', sport)
        .in('position', sport === 'NFL' ? ['QB','RB','WR','TE'] : ['C','1B','2B','3B','SS','OF','DH','SP','RP'])
        .neq('is_legendary_active', true)
        .order('projected_points', { ascending: false })
        .limit(30)
      if (usedIds.length > 0) query = query.not('id', 'in', `(${usedIds.join(',')})`)
      const { data: avail } = await query
      if (!avail || avail.length === 0) continue
      const picked = avail[Math.floor(Math.random() * Math.min(avail.length, 15))]
      usedIds.push(picked.id)
      pickedPlayers.push(picked)
    }
  }

  // Sort bronze first → platinum last for dramatic reveal
  const TIER_ORDER = { common:0, bronze:1, silver:2, gold:3, platinum:4, legendary:5 }
  pickedPlayers.sort((a,b) => (TIER_ORDER[a.tier]||0) - (TIER_ORDER[b.tier]||0))

  setTimeout(() => {
    document.getElementById('packStage').style.display = 'none'
    showReveal()
  }, 850)
}

// Which `.skin-X` class recolors the revealed card's background/border/
// glow, and which `.fill-X` solid color paints inside the silhouette
// mask — matches the same equipped-skin treatment used on roster.html
// and dashboard.html, so a reveal looks consistent with the roster.
function skinClass() {
  return (equippedSkin && equippedSkin !== 'classic') ? `skin-${equippedSkin}` : ''
}
function skinFillClass() {
  return (equippedSkin && equippedSkin !== 'classic') ? `fill-${equippedSkin}` : 'fill-classic'
}

function buildCard(player) {
  const isPitcher = PITCHER_POS.includes(player.position)
  let img
  if (sport === 'NFL') {
    const nflImgs = { QB: QB_IMG, RB: RB_IMG, WR: WR_IMG, TE: TE_IMG, K: K_IMG }
    img = nflImgs[player.position] || WR_IMG
  } else {
    img = (isPitcher) ? PITCHER_IMG : BATTER_IMG
  }
  return `<div class="card-scene" id="scene-${player.id}" onclick="flipCard('${player.id}')">
    <div class="card-inner">
      <div class="card-back"></div>
      <div class="card-face">
        <div class="player-card ${player.tier} ${skinClass()}" id="card-${player.id}">
          <div class="card-rays"></div>
          <div class="card-glow"></div>
          <div class="card-shine"></div>
          <div class="card-tier">${player.tier.toUpperCase()}</div>
          <div class="card-coin">${TIER_COIN[player.tier]||''}</div>
          <div class="${isPitcher ? 'card-art-pitcher' : 'card-art-batter'}">
            ${player.position === 'DST'
              ? `<div class="dst-abbrev">${player.team}</div>`
              : `<div class="card-art-fill ${skinFillClass()}" style="-webkit-mask-image:url(${img});mask-image:url(${img});" role="img" aria-label="${player.name}"></div>`}
          </div>
          <div class="card-divider"></div>
          <div class="card-info">
            <div class="card-name">${player.name}</div>
            <div class="card-pos-team"><span>${player.position}</span><span>${player.team}</span></div>
            <div class="card-new">+ NEW</div>
          </div>
        </div>
      </div>
    </div>
  </div>`
}

// Desktop keeps the original all-at-once grid — it was never the
// problem. Mobile gets the new one-at-a-time deck. Checked once per
// reveal since orientation/window size won't realistically change
// mid-pack-opening.
// Checked fresh every time a pack is opened (not once at page load) so
// resizing the window or toggling device mode without a full reload —
// e.g. while testing in DevTools — still picks up the current width
// correctly. Stays fixed for the rest of that one reveal session once
// it's opened, so resizing mid-reveal doesn't switch modes underneath you.
let IS_MOBILE_REVEAL = false

function showReveal() {
  IS_MOBILE_REVEAL = window.matchMedia('(max-width: 900px)').matches
  document.getElementById('revealStage').classList.add('active')

  const counts = {}
  pickedPlayers.forEach(p => { counts[p.tier] = (counts[p.tier]||0)+1 })
  const tiers = ['legendary','platinum','gold','silver','bronze']
  document.getElementById('revealSummary').innerHTML = tiers
    .filter(t => counts[t])
    .map(t => `<div class="summary-pill ${t}">${counts[t]}× ${t.charAt(0).toUpperCase()+t.slice(1)}</div>`)
    .join('')
  document.getElementById('revealSummary').style.display = 'flex'

  if (!counts.legendary) {
    document.getElementById('revealTitle').textContent =
      leagueWeek <= 1 ? 'YOUR STARTER ROSTER' : `YOUR WEEK ${leagueWeek} PACK`
  }

  if (counts.legendary) {
    document.getElementById('revealTitle').textContent = '🔥 LEGENDARY PULL! 🔥'
    document.body.insertAdjacentHTML('beforeend','<div class="legendary-flash"></div>')
  }

  currentRevealIndex = 0

  if (IS_MOBILE_REVEAL) {
    document.getElementById('mobileDeckWrap').style.display = 'flex'
    document.getElementById('desktopGridWrap').style.display = 'none'
    document.getElementById('instantRevealBtn').style.display = 'inline-flex'

    document.getElementById('deckStack').innerHTML = pickedPlayers.map(p => buildCard(p)).join('')
    reviewMode = false
    repositionStack()
  } else {
    document.getElementById('mobileDeckWrap').style.display = 'none'
    document.getElementById('desktopGridWrap').style.display = 'flex'
    document.getElementById('revealNextBtn').style.display = 'inline-flex'
    document.getElementById('revealAllBtn').style.display = 'inline-flex'

    document.getElementById('cardsReveal').innerHTML = pickedPlayers.map(p => buildCard(p)).join('')
    allRevealed = false
    setTimeout(() => {
      revealCardAt(0, false)
      currentRevealIndex = 1
    }, 400)
  }
}

window.flipCard = (playerId) => {
  if (IS_MOBILE_REVEAL) {
    if (reviewMode) return // in review mode, cards are just for looking — use the arrows to move
    const idx = pickedPlayers.findIndex(p => String(p.id) === String(playerId))
    if (idx !== currentRevealIndex) return // only the front card of the deck is tappable
    const scene = document.getElementById(`scene-${playerId}`)
    if (!scene) return
    if (!scene.classList.contains('flipped')) {
      scene.classList.add('flipped')
      updateProgress()
      return
    }
    // Already flipped — send it to the back of the pack and bring the next one forward
    advanceDeck()
    return
  }

  // ── Desktop: original grid flip behavior, unchanged ──
  const scene = document.getElementById(`scene-${playerId}`)
  if (!scene || scene.classList.contains('flipped')) return
  scene.classList.add('flipped')
  const idx = pickedPlayers.findIndex(p => String(p.id) === String(playerId))
  if (idx === currentRevealIndex - 1) {
    if (currentRevealIndex < pickedPlayers.length) {
      setTimeout(() => {
        revealCardAt(currentRevealIndex)
        currentRevealIndex++
      }, 300)
    } else {
      checkAllFlipped()
    }
  }
}

// ═══ DESKTOP: original all-at-once grid (unchanged) ═══════════════════
let currentRevealIndex = 0
let allRevealed = false

function revealCardAt(index, autoFlip = false) {
  if (index >= pickedPlayers.length) return
  const p = pickedPlayers[index]
  const scene = document.getElementById(`scene-${p.id}`)
  if (scene) {
    scene.classList.add('dealt')
    scene.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
    if (autoFlip) {
      setTimeout(() => { scene.classList.add('flipped') }, 200)
    }
  }
}

function checkAllFlipped() {
  const allFlipped = pickedPlayers.every(p => {
    const scene = document.getElementById(`scene-${p.id}`)
    return scene && scene.classList.contains('flipped')
  })
  if (allFlipped) {
    allRevealed = true
    document.getElementById('revealNextBtn').style.display = 'none'
    document.getElementById('revealAllBtn').style.display = 'none'
    document.getElementById('addRosterBtn').style.display = 'inline-flex'
  }
}

window.revealNext = () => {
  if (allRevealed) return
  if (currentRevealIndex >= pickedPlayers.length) return
  revealCardAt(currentRevealIndex, false)
  currentRevealIndex++
}

window.revealAll = () => {
  if (allRevealed) return

  // Any card already dealt but not yet flipped (the first card, dealt
  // automatically by showReveal but never flipped) needs to be flipped
  // now, otherwise the loop below (which only handles cards from
  // currentRevealIndex onward) skips it and it stays face-down forever.
  for (let i = 0; i < currentRevealIndex; i++) {
    const p = pickedPlayers[i]
    const scene = document.getElementById(`scene-${p.id}`)
    if (scene && !scene.classList.contains('flipped')) {
      scene.classList.add('flipped')
    }
  }

  const TIER_DELAY = { common: 250, bronze: 350, silver: 500, gold: 700, platinum: 1100, legendary: 1800 }
  let cumDelay = 0

  for (let i = currentRevealIndex; i < pickedPlayers.length; i++) {
    const p = pickedPlayers[i]
    const dealDelay = cumDelay
    cumDelay += TIER_DELAY[p.tier] || 350
    const flipDelay = cumDelay - 150

    setTimeout(() => revealCardAt(i, false), dealDelay)
    setTimeout(() => {
      const scene = document.getElementById(`scene-${p.id}`)
      if (scene) scene.classList.add('flipped')
      if (i === pickedPlayers.length - 1) {
        setTimeout(() => {
          allRevealed = true
          document.getElementById('revealNextBtn').style.display = 'none'
          document.getElementById('revealAllBtn').style.display = 'none'
          document.getElementById('addRosterBtn').style.display = 'inline-flex'
        }, 500)
      }
    }, flipDelay)
  }
  currentRevealIndex = pickedPlayers.length
}

// ═══ MOBILE: one-at-a-time deck + browse-back review ═══════════════════
let reviewMode = false

function repositionStack() {
  pickedPlayers.forEach((p, i) => {
    const scene = document.getElementById(`scene-${p.id}`)
    if (!scene) return
    scene.classList.remove('deck-current','deck-ahead-1','deck-ahead-2','deck-discard-1','deck-discard-2','deck-discard-old')
    if (i === currentRevealIndex) {
      scene.classList.add('deck-current')
      scene.style.zIndex = 1000 - i
    } else if (i > currentRevealIndex) {
      const depth = i - currentRevealIndex
      scene.classList.add(depth === 1 ? 'deck-ahead-1' : 'deck-ahead-2')
      scene.style.zIndex = 1000 - i
    } else {
      const depth = currentRevealIndex - i
      scene.classList.add(depth === 1 ? 'deck-discard-1' : depth === 2 ? 'deck-discard-2' : 'deck-discard-old')
      scene.style.zIndex = i
    }
  })
  updateProgress()
}

function updateProgress() {
  document.getElementById('deckProgress').textContent = `Card ${currentRevealIndex + 1} of ${pickedPlayers.length}`
  document.getElementById('deckHint').textContent = reviewMode
    ? ''
    : (document.getElementById(`scene-${pickedPlayers[currentRevealIndex]?.id}`)?.classList.contains('flipped')
        ? (currentRevealIndex < pickedPlayers.length - 1 ? 'Tap again for the next card' : 'Tap to finish')
        : 'Tap the card to reveal it')
}

function advanceDeck() {
  currentRevealIndex++
  if (currentRevealIndex < pickedPlayers.length) {
    repositionStack()
  } else {
    enterReviewMode()
  }
}

// "Reveal All Instantly" — flips every remaining card immediately and
// jumps straight to review mode. No staggered animation delay.
window.instantRevealRest = () => {
  pickedPlayers.forEach(p => {
    const scene = document.getElementById(`scene-${p.id}`)
    if (scene) scene.classList.add('flipped')
  })
  enterReviewMode()
}

function enterReviewMode() {
  reviewMode = true
  currentRevealIndex = 0
  repositionStack()
  document.getElementById('instantRevealBtn').style.display = 'none'
  document.getElementById('deckNav').style.display = 'flex'
  document.getElementById('addRosterBtn').style.display = 'inline-flex'
}

// Browse back and forth through every already-revealed card once the
// pack is fully opened — same stack, just moving which card sits "on top."
window.reviewStep = (delta) => {
  currentRevealIndex = (currentRevealIndex + delta + pickedPlayers.length) % pickedPlayers.length
  repositionStack()
}

window.addToRoster = async () => {
  const btn = document.getElementById('addRosterBtn')
  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span> Saving...'

  try {
    // ── Slot-based is_active assignment ──────────────────────────────────────
    // Determine which players fill lineup slots vs go to bench, using the same
    // slot definitions as roster.html so is_active is correct from the start.
    const MLB_SLOTS = [
      { label:'C',   eligible:['C'] },
      { label:'1B',  eligible:['1B'] },
      { label:'2B',  eligible:['2B'] },
      { label:'3B',  eligible:['3B'] },
      { label:'SS',  eligible:['SS'] },
      { label:'OF',  eligible:['OF'] },
      { label:'OF',  eligible:['OF'] },
      { label:'OF',  eligible:['OF'] },
      { label:'SP',  eligible:['SP','P'] },
      { label:'SP',  eligible:['SP','P'] },
      { label:'SP',  eligible:['SP','P'] },
      { label:'RP',  eligible:['RP','P'] },
      { label:'UT',  eligible:['C','1B','2B','3B','SS','OF','DH'] },
    ]
    const NFL_SLOTS = [
      { label:'QB',   eligible:['QB'] },
      { label:'RB',   eligible:['RB'] },
      { label:'RB',   eligible:['RB'] },
      { label:'WR',   eligible:['WR'] },
      { label:'WR',   eligible:['WR'] },
      { label:'WR',   eligible:['WR'] },
      { label:'TE',   eligible:['TE'] },
      { label:'FLEX', eligible:['RB','WR','TE'] },
      { label:'K',    eligible:['K'] },
      { label:'DEF',  eligible:['DST','DEF'] },
    ]
    const MLB_POS_ORDER = ['C','1B','2B','3B','SS','OF','DH','SP','RP','P']
    const NFL_POS_ORDER = ['QB','RB','WR','TE','K','DST','DEF']

    const slots = sport === 'NFL' ? NFL_SLOTS : MLB_SLOTS
    const posOrder = sport === 'NFL' ? NFL_POS_ORDER : MLB_POS_ORDER

    // Sort players so those with fewest eligible slots go first — prevents
    // flexible slots (UT/FLEX/DH) from stealing dedicated-slot players.
    // Within players that are otherwise tied, higher-tier cards go first so
    // a Gold WR claims a starting slot ahead of a Bronze WR instead of it
    // coming down to whatever order the pack happened to deal them in.
    const slotCountFor = (pos) => slots.filter(s => s.eligible.includes(pos)).length
    const TIER_RANK = { legendary: 5, platinum: 4, gold: 3, silver: 2, bronze: 1 }
    const tierRankOf = (p) => TIER_RANK[(p.tier || '').toLowerCase()] || 0
    const sorted = [...pickedPlayers].sort((a, b) => {
      const aSlots = slotCountFor(a.position)
      const bSlots = slotCountFor(b.position)
      if (aSlots !== bSlots) return aSlots - bSlots
      const aTier = tierRankOf(a), bTier = tierRankOf(b)
      if (aTier !== bTier) return bTier - aTier
      const ai = posOrder.indexOf(a.position)
      const bi = posOrder.indexOf(b.position)
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi)
    })

    // Two-pass slot matcher (same algorithm as roster.html)
    const slotted = new Array(slots.length).fill(null)
    const usedForSlot = new Set()
    // Pass 1: exact position match
    slots.forEach((slot, si) => {
      for (const p of sorted) {
        if (usedForSlot.has(p.id)) continue
        if (slot.eligible.includes(p.position) && slot.label === p.position) {
          slotted[si] = p; usedForSlot.add(p.id); return
        }
      }
    })
    // Pass 2: any eligible player
    slots.forEach((slot, si) => {
      if (slotted[si]) return
      for (const p of sorted) {
        if (usedForSlot.has(p.id)) continue
        if (slot.eligible.includes(p.position)) {
          slotted[si] = p; usedForSlot.add(p.id); return
        }
      }
    })
    const activeIds = new Set(slotted.filter(Boolean).map(p => p.id))

    const rows = pickedPlayers.map(p => ({
      team_id: teamId, player_id: p.id,
      league_id: leagueId, slot: p.position || 'UTIL',
      is_active: activeIds.has(p.id)
    }))
    const { error } = await supabase.from('rosters').insert(rows)
    if (error) throw error
    
    // Mark pack as opened for this week so user can't refresh and reopen
    // until the next weekly reset advances league.week_number
    await supabase.from('teams').update({ pack_opened_week: leagueWeek }).eq('id', teamId)
    
    await supabase.from('transactions').insert(
      rows.map(r => ({ league_id:leagueId, team_id:teamId, type:'pickup', player_id:r.player_id, coins_spent:0, week_number:leagueWeek }))
    )
    const { data: teamRow } = await supabase.from('teams').select('team_name, name').eq('id', teamId).single()
    await supabase.from('live_feed').insert({
      league_id:   leagueId,
      event_type:  'pack',
      description: `🎁 ${teamRow?.team_name || teamRow?.name || 'A team'} opened their Week ${leagueWeek} pack (${rows.length} new player${rows.length === 1 ? '' : 's'})`,
      created_at:  new Date().toISOString()
    })
    localStorage.removeItem('packPending')
    window.location.href = 'dashboard.html'
  } catch(err) {
    btn.disabled = false
    btn.textContent = 'Add All to Roster →'

    // A duplicate-key error here means another team in this league opened
    // a pack at nearly the same moment and claimed one of these same
    // players first (a race condition — both packs checked "who's
    // available" before either had saved). Reloading re-runs the
    // exclusion query fresh and draws a clean pack instead of showing a
    // raw database error.
    const isRaceCondition = err?.message?.includes('duplicate key') || err?.code === '23505'
    if (isRaceCondition) {
      alert('One of your cards was just claimed by another team in your league at the same moment (this can happen if two teams open packs at once). Reloading to draw you a fresh pack — click Add All to Roster again once it loads.')
      window.location.reload()
      return
    }
    alert('Error: ' + err.message)
  }
}

init()
</script>
