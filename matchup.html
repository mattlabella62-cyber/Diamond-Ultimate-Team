<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiamondUT — Matchup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap');
:root {
  --font-display: 'Bebas Neue', 'Arial Black', sans-serif;
  --font-body: 'DM Sans', 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  --gold: #F5C518;
  --gold2: #FFE066;
  --gold-glow: rgba(245,197,24,0.3);
  --red: #E8433B;
  --green: #27C96A;
  --blue: #3B8BF5;
  --platinum-c: #c4b5fd;
  --bronze-c: #f0a070;
  --silver-c: #c0d8f0;
  --bg: #060810;
  --bg2: #0A0D14;
  --surface: #0F1218;
  --surface2: #151B25;
  --surface3: #1C2333;
  --border: #1E2535;
  --border2: #283044;
  --text: #E8ECF4;
  --muted: #5A6A82;
  --muted2: #3A4558;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(245,197,24,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(59,139,245,0.04) 0%, transparent 50%);
}

/* ═══ SIDEBAR (shared) ═══ */
.sidebar {
  width: 230px; min-height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; z-index: 200;
}
.logo { padding: 22px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.logo-diamond {
  width: 36px; height: 36px; background: linear-gradient(135deg, var(--gold), #FF8C00);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); flex-shrink: 0;
}
.logo-text { line-height: 1; }
.logo-name { font-family: var(--font-display); font-size: 20px; letter-spacing: 2px; color: var(--gold); }
.logo-sub { font-family: var(--font-mono); font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }
.nav { padding: 14px 12px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-section { font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px; color: var(--muted2); padding: 10px 8px 5px; text-transform: uppercase; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
  font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all 0.15s;
  text-decoration: none; position: relative;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: rgba(245,197,24,0.1); color: var(--gold); border: 1px solid rgba(245,197,24,0.2); }
.nav-item.active::before {
  content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 60%; background: var(--gold); border-radius: 0 2px 2px 0;
}
.nav-icon { font-size: 15px; width: 20px; text-align: center; }
.nav-badge { margin-left: auto; font-family: var(--font-mono); font-size: 9px; background: var(--red); color: white; padding: 2px 6px; border-radius: 99px; font-weight: 700; }
.coin-widget {
  margin: 12px; background: linear-gradient(135deg, rgba(245,197,24,0.08), rgba(245,197,24,0.03));
  border: 1px solid rgba(245,197,24,0.2); border-radius: 10px; padding: 14px;
}
.coin-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
.coin-amount { font-family: var(--font-display); font-size: 34px; color: var(--gold); line-height: 1.1; margin-top: 2px; }
.coin-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
.coin-track { height: 4px; background: var(--border2); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.coin-fill { height: 100%; width: 68%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; }

/* ═══ MAIN ═══ */
.main { margin-left: 230px; flex: 1; display: flex; flex-direction: column; }
.topbar {
  height: 58px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 28px; gap: 14px; position: sticky; top: 0; z-index: 100;
}
.topbar-title { font-family: var(--font-display); font-size: 22px; letter-spacing: 3px; color: var(--text); flex: 1; }
.week-pill { font-family: var(--font-mono); font-size: 10px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border2); padding: 5px 12px; border-radius: 99px; }
.content { padding: 24px 28px 60px; display: flex; flex-direction: column; gap: 20px; }

/* ═══ MATCHUP SWITCHER ═══ */
.switcher {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px;
}
.switcher select {
  flex: 1; background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
  font-family: var(--font-mono); font-size: 12px; padding: 8px 10px; border-radius: 7px; cursor: pointer;
}
.switcher-btn {
  font-family: var(--font-mono); font-size: 14px; color: var(--muted); background: var(--surface2);
  border: 1px solid var(--border2); border-radius: 7px; width: 32px; height: 32px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.switcher-btn:hover { background: var(--surface3); color: var(--text); }
.week-label {
  flex: 1; text-align: center; font-family: var(--font-display); font-size: 16px;
  letter-spacing: 2px; color: var(--text);
}

/* ═══ SCOREBOARD ═══ */
.scoreboard {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px 30px;
}
.sb-team { display: flex; flex-direction: column; gap: 6px; }
.sb-team.right { align-items: flex-end; text-align: right; }
.sb-avatar {
  width: 46px; height: 46px; border-radius: 50%; background: var(--surface3); color: var(--muted);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-mono);
  font-size: 15px; font-weight: 700; margin-bottom: 4px;
}
.sb-team.me .sb-avatar { background: rgba(245,197,24,0.15); color: var(--gold); }
.sb-name { font-family: var(--font-display); font-size: 20px; letter-spacing: 1px; }
.sb-team.me .sb-name { color: var(--gold); }
.sb-record { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.sb-score { font-family: var(--font-display); font-size: 46px; margin-top: 2px; }
.sb-score.zero { color: var(--muted); }
.sb-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 24px; }
.sb-vs { font-family: var(--font-mono); font-size: 11px; color: var(--muted2); letter-spacing: 2px; }
.sb-status {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  padding: 3px 10px; border-radius: 99px; margin-top: 4px;
}
.sb-status.scheduled { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }
.sb-status.final { background: rgba(39,201,106,0.12); color: var(--green); }
.sb-status.in_progress { background: rgba(245,197,24,0.12); color: var(--gold); }

/* ═══ ROSTER COMPARISON ═══ */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.compare-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.compare-head {
  padding: 12px 16px; border-bottom: 1px solid var(--border); font-family: var(--font-display);
  font-size: 15px; letter-spacing: 1px; color: var(--text);
}
.compare-panel.me .compare-head { color: var(--gold); }
.roster-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border);
}
.roster-row:last-child { border-bottom: none; }
.roster-row:hover { background: var(--surface2); }
.rr-pos { font-family: var(--font-mono); font-size: 9px; color: var(--muted); width: 30px; flex-shrink: 0; }
.rr-name { flex: 1; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rr-tier { font-family: var(--font-mono); font-size: 9px; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
.rr-tier.bronze { color: var(--bronze-c); border: 1px solid rgba(210,100,50,0.4); }
.rr-tier.silver { color: var(--silver-c); border: 1px solid rgba(100,160,220,0.4); }
.rr-tier.gold { color: #ffe066; border: 1px solid rgba(240,180,0,0.4); }
.rr-tier.platinum { color: var(--platinum-c); border: 1px solid rgba(155,80,255,0.4); }
.rr-tier.legendary { color: #FFD166; border: 1px solid rgba(255,180,0,0.6); }
.rr-pts { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--muted); width: 34px; text-align: right; flex-shrink: 0; }

.empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }
.note-banner {
  font-family: var(--font-mono); font-size: 10px; color: var(--muted); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; text-align: center;
}
</style>
</head>
<body>

<!-- ═══ SIDEBAR ═══ -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-diamond"></div>
    <div class="logo-text">
      <div class="logo-name">DiamondUT</div>
      <div class="logo-sub" id="sidebarSportSub">MLB · SEASON 2026</div>
    </div>
  </div>
  <nav class="nav">
    <div class="nav-section">Main</div>
    <a class="nav-item" href="dashboard.html"><span class="nav-icon">⚡</span> Dashboard</a>
    <a class="nav-item" href="roster.html"><span class="nav-icon">🃏</span> My Roster</a>
    <a class="nav-item" href="auction.html"><span class="nav-icon">🏷️</span> Auction House</a>
    <a class="nav-item" href="legendary.html"><span class="nav-icon">👑</span> Legendary</a>
    <div class="nav-section">League</div>
    <a class="nav-item" href="standings.html"><span class="nav-icon">🏆</span> Standings</a>
    <a class="nav-item active" href="matchup.html"><span class="nav-icon">⚔️</span> Matchup</a>
    <a class="nav-item" href="trade.html"><span class="nav-icon">🔄</span> Trade Center<span class="nav-badge" id="tradeBadge" style="display:none">0</span></a>
    <a class="nav-item" href="injury.html"><span class="nav-icon">🏥</span> Injury Pool</a>
    <a class="nav-item" href="pack.html"><span class="nav-icon">📦</span> Open Pack<span class="nav-badge" id="packBadge" style="display:none">NEW</span></a>
    <div class="nav-section">Account</div>
    <a class="nav-item" href="#"><span class="nav-icon">🎨</span> Cosmetics</a>
    <a class="nav-item" href="settings.html"><span class="nav-icon">⚙️</span> Settings</a>
  </nav>
  <div class="coin-widget">
    <div class="coin-label">Coin Balance</div>
    <div class="coin-amount" id="coinAmount">500</div>
    <div class="coin-sub" id="coinSub">500 coins this week</div>
    <div class="coin-track"><div class="coin-fill" id="coinFill" style="width:100%"></div></div>
  </div>
</aside>

<!-- ═══ MAIN ═══ -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title">Matchup</div>
    <div class="week-pill" id="weekPill">WEEK 1 OF 18</div>
  </div>

  <div class="content">
    <div class="switcher">
      <button class="switcher-btn" onclick="stepWeek(-1)">‹</button>
      <div class="week-label" id="viewWeekLabel">WEEK 1</div>
      <button class="switcher-btn" onclick="stepWeek(1)">›</button>
    </div>

    <div class="switcher">
      <button class="switcher-btn" onclick="stepMatchup(-1)">‹</button>
      <select id="matchupSelect" onchange="onSwitcherChange()"></select>
      <button class="switcher-btn" onclick="stepMatchup(1)">›</button>
    </div>

    <div id="matchupBody">
      <div class="empty-state">Loading matchup…</div>
    </div>
  </div>
</main>

<script type="module">
import { supabase } from './supabase.js'

const SEASON_WEEKS = { NFL: 18, MLB: 26 }
let leagueId, teamId, sport, leagueWeek, effectiveSeasonWeeks
let viewWeek = 1       // which week the page is currently browsing (independent of leagueWeek)
let weekMatchups = []   // all matchups for viewWeek
let currentIndex = 0    // index into weekMatchups currently displayed

async function init() {
  const { data: { user } } = await supabase.auth.getUser()
  if (!user) { window.location.href = 'login.html'; return }

  leagueId = localStorage.getItem('activeLeagueId')
  teamId   = localStorage.getItem('activeTeamId')
  sport    = localStorage.getItem('activeSport') || 'MLB'
  if (!leagueId || !teamId) { window.location.href = 'dashboard.html'; return }

  document.getElementById('sidebarSportSub').textContent = `${sport} · SEASON 2026`

  const { data: leagueRow } = await supabase.from('leagues').select('week_number, season_weeks').eq('id', leagueId).single()
  leagueWeek = leagueRow?.week_number || 1
  viewWeek = leagueWeek
  effectiveSeasonWeeks = leagueRow?.season_weeks || SEASON_WEEKS[sport] || 18
  document.getElementById('weekPill').textContent = `WEEK ${leagueWeek} OF ${effectiveSeasonWeeks}`

  const { data: teamRow } = await supabase.from('teams').select('coins').eq('id', teamId).single()
  const coins = teamRow?.coins ?? 0
  document.getElementById('coinAmount').textContent = coins
  document.getElementById('coinSub').textContent = `${coins} coins this week`
  document.getElementById('coinFill').style.width = Math.min((coins / 500) * 100, 100) + '%'

  await loadWeekMatchups()
  loadTradeBadge()
  loadPackBadge()
}

async function loadWeekMatchups() {
  document.getElementById('viewWeekLabel').textContent = `WEEK ${viewWeek}${viewWeek === leagueWeek ? ' (CURRENT)' : ''}`

  const { data: matchups } = await supabase
    .from('matchups').select('id, team_a_id, team_b_id, team_a_score, team_b_score, status')
    .eq('league_id', leagueId).eq('week_number', viewWeek)

  if (!matchups || matchups.length === 0) {
    document.getElementById('matchupBody').innerHTML = `<div class="empty-state">No matchups scheduled for this week yet.</div>`
    document.getElementById('matchupSelect').innerHTML = '<option>No matchups</option>'
    return
  }

  const teamIds = [...new Set(matchups.flatMap(m => [m.team_a_id, m.team_b_id]))]
  const { data: teams } = await supabase.from('teams').select('id, team_name').in('id', teamIds)
  const nameOf = id => teams?.find(t => t.id === id)?.team_name || 'Unnamed Team'

  weekMatchups = matchups.map(m => ({ ...m, aName: nameOf(m.team_a_id), bName: nameOf(m.team_b_id) }))

  // Default to the viewer's own matchup if they have one this week
  const myIndex = weekMatchups.findIndex(m => m.team_a_id === teamId || m.team_b_id === teamId)
  currentIndex = myIndex >= 0 ? myIndex : 0

  document.getElementById('matchupSelect').innerHTML = weekMatchups.map((m, i) =>
    `<option value="${i}">${m.aName}${m.team_a_id === teamId || m.team_b_id === teamId ? ' (You)' : ''} vs ${m.bName}</option>`
  ).join('')
  document.getElementById('matchupSelect').value = currentIndex

  await renderMatchup()
}

window.stepWeek = function(delta) {
  const next = viewWeek + delta
  if (next < 1 || next > effectiveSeasonWeeks) return
  viewWeek = next
  loadWeekMatchups()
}

window.stepMatchup = function(delta) {
  if (weekMatchups.length === 0) return
  currentIndex = (currentIndex + delta + weekMatchups.length) % weekMatchups.length
  document.getElementById('matchupSelect').value = currentIndex
  renderMatchup()
}

window.onSwitcherChange = function() {
  currentIndex = parseInt(document.getElementById('matchupSelect').value, 10)
  renderMatchup()
}

async function loadTeamRoster(id) {
  const { data: rosterRows } = await supabase
    .from('rosters').select('player_id, is_active').eq('team_id', id).eq('league_id', leagueId)
  const playerIds = (rosterRows || []).map(r => r.player_id)
  if (playerIds.length === 0) return []
  const { data: players } = await supabase
    .from('players').select('id, name, position, tier').in('id', playerIds)
  return (rosterRows || [])
    .map(r => ({ ...players?.find(p => p.id === r.player_id), is_active: r.is_active }))
    .filter(p => p.id)
    .sort((a, b) => (b.is_active - a.is_active))
}

async function renderMatchup() {
  const m = weekMatchups[currentIndex]
  const body = document.getElementById('matchupBody')
  if (!m) { body.innerHTML = `<div class="empty-state">No matchup selected.</div>`; return }

  body.innerHTML = `<div class="empty-state">Loading rosters…</div>`

  const [aRoster, bRoster] = await Promise.all([
    loadTeamRoster(m.team_a_id), loadTeamRoster(m.team_b_id)
  ])

  const rowHtml = p => `
    <div class="roster-row">
      <div class="rr-pos">${p.position || ''}</div>
      <div class="rr-name">${p.name}</div>
      <div class="rr-tier ${p.tier}">${(p.tier || '').toUpperCase()}</div>
      <div class="rr-pts">—</div>
    </div>`

  body.innerHTML = `
    <div class="scoreboard">
      <div class="sb-team ${m.team_a_id === teamId ? 'me' : ''}">
        <div class="sb-avatar">${(m.aName||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}</div>
        <div class="sb-name">${m.aName}${m.team_a_id === teamId ? ' (You)' : ''}</div>
        <div class="sb-score ${m.status === 'scheduled' ? 'zero' : ''}">${m.team_a_score}</div>
      </div>
      <div class="sb-mid">
        <div class="sb-vs">VS</div>
        <div class="sb-status ${m.status}">${m.status.replace('_',' ')}</div>
      </div>
      <div class="sb-team right ${m.team_b_id === teamId ? 'me' : ''}">
        <div class="sb-avatar">${(m.bName||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}</div>
        <div class="sb-name">${m.bName}${m.team_b_id === teamId ? ' (You)' : ''}</div>
        <div class="sb-score ${m.status === 'scheduled' ? 'zero' : ''}">${m.team_b_score}</div>
      </div>
    </div>

    <div class="note-banner">Live per-player scoring isn't wired in yet — this shows each team's active lineup for the week; points will populate once the scoring API is connected.</div>

    <div class="compare-grid">
      <div class="compare-panel ${m.team_a_id === teamId ? 'me' : ''}">
        <div class="compare-head">${m.aName}</div>
        ${aRoster.filter(p=>p.is_active).map(rowHtml).join('') || '<div class="empty-state">No active lineup set.</div>'}
      </div>
      <div class="compare-panel ${m.team_b_id === teamId ? 'me' : ''}">
        <div class="compare-head">${m.bName}</div>
        ${bRoster.filter(p=>p.is_active).map(rowHtml).join('') || '<div class="empty-state">No active lineup set.</div>'}
      </div>
    </div>
  `
}

async function loadTradeBadge() {
  const { count } = await supabase.from('trades').select('id', { count: 'exact', head: true }).eq('receiver_team_id', teamId).eq('status', 'pending')
  const badge = document.getElementById('tradeBadge')
  if (badge && count > 0) { badge.textContent = count; badge.style.display = '' }
}

async function loadPackBadge() {
  const { data: team } = await supabase.from('teams').select('pack_opened_week').eq('id', teamId).single()
  const badge = document.getElementById('packBadge')
  if (badge && team?.pack_opened_week !== leagueWeek) { badge.style.display = '' }
}

init()
</script>
</body>
</html>
