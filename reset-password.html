<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiamondUT — Reset Password</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap');
:root {
  --font-display: 'Bebas Neue', 'Arial Black', sans-serif;
  --font-body: 'DM Sans', 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  --gold: #F5C518; --gold2: #FFE066; --gold-glow: rgba(245,197,24,0.3);
  --red: #E8433B; --green: #27C96A; --blue: #3B8BF5;
  --bg: #060810; --surface: #0F1218; --surface2: #151B25;
  --border: #1E2535; --border2: #283044;
  --text: #E8ECF4; --muted: #5A6A82; --muted2: #3A4558;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-body); min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(245,197,24,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(59,139,245,0.06) 0%, transparent 50%);
}

.auth-card {
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
}

.auth-header {
  padding: 36px 36px 24px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(160deg, rgba(245,197,24,0.06), transparent);
  position: relative;
}
.logo-wrap {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin-bottom: 8px; position: relative; z-index: 1;
}
.logo-diamond {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--gold), #FF8C00);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 24px rgba(245,197,24,0.4);
}
.logo-name {
  font-family: var(--font-display);
  font-size: 32px; letter-spacing: 4px; color: var(--gold);
}
.auth-tagline {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 3px;
  color: var(--muted); text-transform: uppercase;
  position: relative; z-index: 1;
}

.auth-body { padding: 28px 36px 36px; }

.form-group { margin-bottom: 18px; }
.form-label {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 2px;
  color: var(--muted); text-transform: uppercase;
  display: block; margin-bottom: 7px;
}
.form-input {
  width: 100%; padding: 11px 14px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text);
  font-family: var(--font-body); font-size: 14px;
  transition: border-color 0.15s, box-shadow 0.15s;
  outline: none;
}
.form-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(245,197,24,0.1);
}
.form-input::placeholder { color: var(--muted2); }
.form-hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

.auth-btn {
  width: 100%; padding: 13px;
  background: var(--gold); color: var(--bg);
  border: none; border-radius: 8px;
  font-family: var(--font-display);
  font-size: 18px; letter-spacing: 3px;
  cursor: pointer; transition: all 0.15s;
  margin-top: 8px;
}
.auth-btn:hover { background: var(--gold2); transform: translateY(-1px); box-shadow: 0 6px 24px var(--gold-glow); }
.auth-btn:active { transform: scale(0.98); }
.auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.alert {
  padding: 11px 14px; border-radius: 8px;
  font-size: 13px; margin-bottom: 18px;
  display: none; line-height: 1.5;
}
.alert.error   { background: rgba(232,67,59,0.1);  border: 1px solid rgba(232,67,59,0.3);  color: #ff8a84; display: block; }
.alert.success { background: rgba(39,201,106,0.1); border: 1px solid rgba(39,201,106,0.3); color: #27C96A; display: block; }

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(0,0,0,0.3);
  border-top-color: var(--bg);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block; vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.success-state { text-align: center; padding: 20px 0; display: none; }
.success-state.visible { display: block; }
.success-icon { font-size: 48px; margin-bottom: 12px; }
.success-title { font-family: var(--font-display); font-size: 24px; letter-spacing: 2px; color: var(--green); margin-bottom: 8px; }
.success-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.btn-go {
  display: inline-block; padding: 13px 28px; background: var(--gold);
  color: var(--bg); font-family: var(--font-display); font-size: 16px;
  letter-spacing: 2px; border-radius: 8px; text-decoration: none; transition: opacity 0.15s;
}
.btn-go:hover { opacity: 0.85; }

.auth-footer {
  padding: 16px 36px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-family: var(--font-mono);
  font-size: 10px; color: var(--muted2);
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <div class="logo-wrap">
      <div class="logo-diamond">⬦</div>
      <div class="logo-name">DiamondUT</div>
    </div>
    <div class="auth-tagline">Reset Your Password</div>
  </div>

  <div class="auth-body">
    <div id="resetForm">
      <div class="alert" id="resetAlert"></div>
      <div class="form-hint" style="margin-bottom:16px">Enter a new password for your account.</div>

      <div class="form-group">
        <label class="form-label">New Password</label>
        <input class="form-input" type="password" id="newPassword" placeholder="Min 6 characters" />
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input class="form-input" type="password" id="confirmPassword" placeholder="••••••••" />
      </div>

      <button class="auth-btn" id="resetBtn" onclick="handleReset()">Update Password</button>
    </div>

    <div class="success-state" id="successState">
      <div class="success-icon">✅</div>
      <div class="success-title">PASSWORD UPDATED</div>
      <div class="success-sub">You can now log in with your new password.</div>
      <a class="btn-go" href="login.html">GO TO LOGIN →</a>
    </div>
  </div>

  <div class="auth-footer">MLB · SEASON 2026 · DIAMONDUT</div>
</div>

<script type="module">
import { supabase } from './supabase.js'

function showAlert(msg, type) {
  const el = document.getElementById('resetAlert')
  el.textContent = msg
  el.className = `alert ${type}`
}

function setLoading(loading) {
  const btn = document.getElementById('resetBtn')
  btn.disabled = loading
  btn.innerHTML = loading ? `<span class="spinner"></span> Updating...` : 'Update Password'
}

window.handleReset = async () => {
  const newPassword = document.getElementById('newPassword').value
  const confirm = document.getElementById('confirmPassword').value

  if (!newPassword || !confirm) {
    showAlert('Please fill in both fields.', 'error')
    return
  }
  if (newPassword !== confirm) {
    showAlert('Passwords do not match.', 'error')
    return
  }
  if (newPassword.length < 6) {
    showAlert('Password must be at least 6 characters.', 'error')
    return
  }

  setLoading(true)

  try {
    const { error } = await supabase.auth.updateUser({ password: newPassword })
    if (error) throw error

    document.getElementById('resetForm').style.display = 'none'
    document.getElementById('successState').classList.add('visible')
  } catch (err) {
    // A missing/expired recovery session is the most common failure here —
    // give a clear next step instead of a raw error message.
    if (err.message && err.message.toLowerCase().includes('session')) {
      showAlert('This reset link has expired or is invalid. Please request a new one from the login page.', 'error')
    } else {
      showAlert(err.message, 'error')
    }
    setLoading(false)
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('resetForm').style.display !== 'none') {
    window.handleReset()
  }
})
</script>
</body>
</html>
